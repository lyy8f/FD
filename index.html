<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIVO - بطاقة التعريف الرقمية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #171717; width: 100%; max-width: 380px; border-radius: 24px; padding: 25px; text-align: center; border: 1px solid #2a2a2a; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #ff9900; margin: 0 auto 15px; object-fit: cover; }
        h1 { color: #ff9900; font-size: 26px; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
        .info-box { background: #222; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; color: #ccc; }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; font-weight: bold; font-size: 15px; text-decoration: none; border: none; cursor: pointer; }
        .btn-orange { background-color: #ff9900; color: #000; }
        .btn-dark { background-color: #262626; color: #fff; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="card">
        <!-- ضع رابط صورتك هنا -->
        <img src="https://via.placeholder.com/150" alt="Divo Profile" class="avatar">
        
        <h1>DIVO</h1>
        
        <div class="info-box">
            <p>📍 العراق / بغداد</p>
            <p style="margin-top: 5px;">✉️ wwfahedcom1@gmail.com</p>
        </div>

        <a href="mailto:wwfahedcom1@gmail.com" class="btn btn-orange">طلب تعاون أو استفسار</a>
        <a href="mailto:wwfahedcom1@gmail.com" class="btn btn-dark">حفظ جهة الاتصال</a>
    </div>

</body>
</html>
